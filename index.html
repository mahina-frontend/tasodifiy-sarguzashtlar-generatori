    <title>Tasodifiy sarguzashtlar generatori</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
   <button id="dark-btn" style="position: absolute; top: 20px; right: 20px; background: none; border: none; font-size: 24px; cursor: pointer;">🌙</button>
     <h1 id="welcome-title">Bugun nima qilsam e'kan? 🤔</h1>
     <p class="description">Har kungi bir hil hayotdan charchadingizmi? Sehrli tugmani bosing va bugungi kutilmagan vazifangizni qabul qiling! 😎</p>

     <div style="margin-bottom: 20px; display: flex; gap: 10px;">
      <input type="text" id="new-task-input" placeholder="Yangi vazifa kiriting..." style="flex: 1; padding: 10px 15px; border-radius: 20px; border: 1px solid #ccc; outline: none; font-size: 14px;">
      <button id="add-task-btn" style="background: #9c27b0; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 14px;">Qu'shish ➕</button>
     </div>

     <div class="card" id="block">
        <div id="matn" class="task-pleacholder">Vazifani ku'rish uchun tugmani bosing...</div>

      <div id="result-message" style="display: none; font-size: 24px; font-weight: bold; color: #4a148c; margin-top: 20px; text-align: center;">
         <div id="status-text"></div>
         <div id="big-emoji" style="font-size: 60px; margin-top: 10px;"></div>
      </div>
         <div class="history-container" style="margin-top: 20px; border-top: 1px dashed #ccc; width: 100%;">
            <h3 style="color: #4a148c; font-size: 14px; margin-top: 10px;">Bajarilgan vazifalar tarihi:</h3>
            <ul id="history-list" style="list-style: none; padding: 0; color: #4a148c; font-size: 14px; text-align: left; font-weight: bold;"></ul>
         </div>
          <div id="action-buttons" style="margin-top: 15px; display: none; gap: 10px; justify-content: center; width: 100%;">
            <button id="done-btn" style="background: #4caf50; color: white; border: none; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-weight: bold;">Bajardim✔</button>
            <button id="fail-btn" style="background: #af4c4c; color: white; border: none; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-weight: bold;">Bajarolmadim❌</button>
          </div>
      </div>

     <button id="generate-btn" class="magic-button">Sehrli tugma ✨</button>
  
  </div>
  <footer style="margin-top: 30px; font-size: 13px; color: rgba(255, 255, 255, 0.7); text-align: center; padding: 15px 0;">
    <p>&copy; 2026 Tasodifiy sarguzashtlar. Dasturchi: <span style="color: #fff; font-weight: bold;">Mahina Olimova</span> </p>
